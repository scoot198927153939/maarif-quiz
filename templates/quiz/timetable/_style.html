<style>
  .tt-card { background:#fff; border:1px solid #dfe6e2; border-radius:14px; padding:1rem; margin-bottom:1.25rem; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .tt-head { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:.5rem; margin-bottom:.75rem; }
  .tt-head h2 { margin:0; font-size:1.3rem; }
  .tt-head .code { display:inline-block; background:#1f6f54; color:#fff; border-radius:8px; padding:.1rem .7rem; margin-inline-start:.4rem; direction:ltr; }
  .tt-wrap { overflow-x:auto; }
  table.tt { width:100%; border-collapse:separate; border-spacing:4px; table-layout:fixed; }
  table.tt th { background:#f2f5f4; color:#44524c; font-weight:600; padding:.45rem .3rem; border-radius:8px; font-size:.9rem; }
  table.tt th.day { width:5.5rem; }
  table.tt td { height:3.6rem; padding:.35rem .4rem; border-radius:8px; text-align:center; vertical-align:middle; background:#fafbfb; border:1px dashed #e3e8e6; }
  table.tt td.has { border:0; }
  table.tt td b { display:block; font-size:.95rem; line-height:1.3; }
  table.tt td small { display:block; font-size:.75rem; opacity:.8; margin-top:.15rem; line-height:1.25; }
  table.tt tr.today th.day { background:#1f6f54; color:#fff; }
  table.tt tr.today td { outline:2px solid #1f6f54; outline-offset:-2px; }
  .tt-AR { background:#e3f4e8; color:#165c33; }
  .tt-FR { background:#e3ecfb; color:#1f4f9a; }
  .tt-AN { background:#efe4fb; color:#5b2a9a; }
  .tt-M  { background:#fde6e1; color:#9a2e1f; }
  .tt-PC, .tt-CH { background:#dff3f3; color:#126464; }
  .tt-SN { background:#eef6d9; color:#4b6614; }
  .tt-HG { background:#f6ecdf; color:#7a4c17; }
  .tt-IR { background:#dcefe9; color:#0f5b46; }
  .tt-IC { background:#e8edf3; color:#34495e; }
  .tt-PH { background:#fbe3ef; color:#8d1f5a; }
  .tt-TI { background:#e0f0fb; color:#0d5a85; }
  .tt-other { background:#eef1f0; color:#44524c; }
  .tt-sections { display:flex; flex-wrap:wrap; gap:.4rem; }
  .tt-sections a { padding:.35rem .8rem; border-radius:999px; border:1px solid #cfd8d3; background:#fff; text-decoration:none; color:inherit; direction:ltr; }
  .tt-sections a.on { background:#1f6f54; color:#fff; border-color:#1f6f54; }
  @media (max-width:560px) {
    table.tt { border-spacing:2px; }
    table.tt th.day { width:3.4rem; }
    table.tt th, table.tt td { padding:.25rem .15rem; font-size:.75rem; }
    table.tt td b { font-size:.78rem; }
    table.tt td small { font-size:.65rem; }
    .tt-card { padding:.6rem; }
  }
  @media print {
    .tt-card { break-inside:avoid; page-break-after:always; box-shadow:none; border:0; }
    table.tt td, table.tt th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    table.tt tr.today td { outline:0; }
    table.tt tr.today th.day { background:#f2f5f4; color:#44524c; }
  }
</style>
