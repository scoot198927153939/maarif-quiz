{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>تأكيد الحذف</h2>
  <p>هل أنت متأكد من حذف «{{ object }}»؟ لا يمكن التراجع عن هذا.</p>
  <form method="post">{% csrf_token %}
    <button class="btn danger">نعم، احذف</button>
    <a class="btn" href="{% if cancel_id %}{% url cancel_url cancel_id %}{% else %}{% url cancel_url %}{% endif %}">إلغاء</a>
  </form>
</div>
{% endblock %}
